#:schema https://yazi-rs.github.io/schemas/keymap.json

# Mount.yazi (local partitions / USB drives)
[[mgr.prepend_keymap]]
on   = "M"
run  = "plugin mount"
desc = "Open mount manager"

# GVfs.yazi (MTP phones, network shares, automounts)
[[mgr.prepend_keymap]]
on   = [ "g", "m" ]
run  = "plugin gvfs -- select-then-mount --jump"
desc = "Select and mount GVfs device"

[[mgr.prepend_keymap]]
on   = [ "g", "u" ]
run  = "plugin gvfs -- select-then-unmount"
desc = "Select and unmount GVfs device"
