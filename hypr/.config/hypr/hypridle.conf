general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = niri msg action power-on-monitors
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Dim screen after 0.5 minutes (skip if audio is playing)
listener {
    timeout = 30
    on-timeout = wpctl status | grep -q "active" || [ "$(playerctl status 2>/dev/null)" = "Playing" ] || brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# Lock screen after 1 minute (skip if audio is playing)
listener {
    timeout = 60
    on-timeout = wpctl status | grep -q "active" || [ "$(playerctl status 2>/dev/null)" = "Playing" ] || loginctl lock-session
}

# Turn off display after 5 minutes (skip if audio is playing)
listener {
    timeout = 300
    on-timeout = wpctl status | grep -q "active" || [ "$(playerctl status 2>/dev/null)" = "Playing" ] || niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}

# Suspend laptop after 15 minutes (skip if audio is playing)
listener {
    timeout = 900
    on-timeout = wpctl status | grep -q "active" || [ "$(playerctl status 2>/dev/null)" = "Playing" ] || systemctl suspend
}
