general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    color = rgba(46, 52, 64, 1.0)
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    brightness = 0.75
}

# Clock (Large Bold JetBrainsMono Nerd Font in Nord Frost Blue #88C0D0)
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color = rgba(136, 192, 208, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 165
    halign = center
    valign = center
}

# Date (Nord Snow Storm #D8DEE9)
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(216, 222, 233, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# Greeting ("ilkyy" in Nord Frost Blue #88C0D0)
label {
    monitor =
    text = Hello <span foreground="##88C0D0"><b>ilkyy</b></span> :)
    color = rgba(236, 239, 244, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 260, 46
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(136, 192, 208, 0.85)
    inner_color = rgba(46, 52, 64, 0.9)
    font_color = rgba(236, 239, 244, 1.0)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = true
    placeholder_text = <span foreground="##81A1C1">Password...</span>
    hide_input = false
    check_color = rgba(136, 192, 208, 1.0)
    fail_color = rgba(191, 97, 106, 1.0)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -45
    halign = center
    valign = center
}
